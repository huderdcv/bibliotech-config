server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bibliotech-loan-db
    username: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "health,info,refresh"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "loan-service"
    description: "Bibliotech Loan Service App"
    version: "1.0.0"

loan:
  duration-days: 30
