server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bibliotech-catalog-db
    username: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "health,info,refresh"
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: "catalog-service"
    description: "Bibliotech Catalog Service App"
    version: "1.0.0"
